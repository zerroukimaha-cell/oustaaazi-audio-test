<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oustaazi — Test enregistrement audio</title>
<style>
  :root{
    --gold:#b89146;
    --brown:#4a3823;
    --cream:#f7f2e8;
    --white:#fff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--cream);
    color:var(--brown);
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:min(680px,100%);
    background:var(--white);
    border-radius:22px;
    padding:28px;
    box-shadow:0 12px 40px rgba(70,50,20,.12);
  }
  h1{
    margin:0 0 8px;
    font-size:26px;
  }
  .sub{
    margin:0 0 24px;
    color:#777;
  }
  .status{
    margin:0 0 18px;
    padding:14px 16px;
    border-radius:12px;
    background:#f5f5f5;
    line-height:1.4;
  }
  .timer{
    font-size:42px;
    font-weight:700;
    text-align:center;
    margin:18px 0;
  }
  .actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button,.fileLabel{
    border:0;
    border-radius:12px;
    padding:14px 18px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .primary{
    background:var(--gold);
    color:white;
  }
  .secondary{
    background:white;
    color:var(--brown);
    border:1px solid #ddd;
  }
  .danger{
    background:#eee;
    color:#333;
  }
  #fileInput{display:none}
  audio{
    width:100%;
    margin-top:18px;
    display:none;
  }
  .selected{
    margin-top:14px;
    color:#666;
    display:none;
  }
  .small{
    margin-top:18px;
    font-size:13px;
    color:#777;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>🎙️ Test enregistrement audio</h1>
    <p class="sub">Prototype de l'enregistreur Oustaazi</p>

    <div id="status" class="status">
      Prêt à enregistrer.
    </div>

    <div id="timer" class="timer">00:00</div>

    <div class="actions">
      <button id="recordBtn" class="primary">🎙️ Enregistrer</button>

      <label for="fileInput" class="fileLabel secondary">
        📁 Déposer un fichier audio
      </label>
      <input id="fileInput" type="file" accept="audio/*">
    </div>

    <audio id="player" controls></audio>

    <div id="selected" class="selected"></div>

    <div class="actions" style="margin-top:14px">
      <button id="deleteBtn" class="danger" style="display:none">
        🗑️ Supprimer
      </button>
    </div>

    <div class="small">
      Ce prototype sert uniquement à tester le microphone. Rien n'est envoyé dans Google Drive.
    </div>
  </main>

<script>
let recorder = null;
let chunks = [];
let stream = null;
let timerInterval = null;
let seconds = 0;
let currentUrl = null;

const recordBtn = document.getElementById("recordBtn");
const fileInput = document.getElementById("fileInput");
const player = document.getElementById("player");
const selected = document.getElementById("selected");
const deleteBtn = document.getElementById("deleteBtn");
const status = document.getElementById("status");
const timer = document.getElementById("timer");

function setStatus(text){
  status.textContent = text;
}

function resetTimer(){
  clearInterval(timerInterval);
  seconds = 0;
  timer.textContent = "00:00";
}

function startTimer(){
  resetTimer();
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds/60)).padStart(2,"0");
    const s = String(seconds%60).padStart(2,"0");
    timer.textContent = `${m}:${s}`;
  },1000);
}

function stopTimer(){
  clearInterval(timerInterval);
}

function showAudio(blob, label){
  if(currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = URL.createObjectURL(blob);
  player.src = currentUrl;
  player.style.display = "block";
  selected.textContent = "✅ " + label;
  selected.style.display = "block";
  deleteBtn.style.display = "inline-block";
}

recordBtn.addEventListener("click", async () => {
  if (recorder && recorder.state === "recording"){
    recorder.stop();
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert("Le microphone n'est pas disponible dans ce contexte.");
    return;
  }

  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});

    chunks = [];

    const preferred = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4"
    ];

    let mimeType = "";
    for(const type of preferred){
      if(window.MediaRecorder &&
         MediaRecorder.isTypeSupported &&
         MediaRecorder.isTypeSupported(type)){
        mimeType = type;
        break;
      }
    }

    recorder = mimeType
      ? new MediaRecorder(stream,{mimeType})
      : new MediaRecorder(stream);

    recorder.ondataavailable = e => {
      if(e.data && e.data.size > 0) chunks.push(e.data);
    };

    recorder.onstop = () => {
      stopTimer();
      if(stream){
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      const blob = new Blob(chunks,{
        type: recorder.mimeType || "audio/webm"
      });

      showAudio(blob,"Enregistrement terminé");
      recordBtn.textContent = "🎙️ Enregistrer à nouveau";
      setStatus("Enregistrement terminé. Tu peux l'écouter ou le supprimer.");
    };

    recorder.onerror = e => {
      console.error(e);
      stopTimer();
      setStatus("Une erreur est survenue pendant l'enregistrement.");
      if(stream){
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    };

    recorder.start();
    startTimer();
    recordBtn.textContent = "⏹️ Arrêter";
    setStatus("🔴 Enregistrement en cours...");

  }catch(error){
    console.error(error);

    if(error.name === "NotAllowedError"){
      alert("Le microphone a été refusé. Autorise le microphone dans ton navigateur puis réessaie.");
    }else if(error.name === "NotFoundError"){
      alert("Aucun microphone n'a été détecté.");
    }else if(error.name === "NotReadableError"){
      alert("Le microphone est utilisé par une autre application.");
    }else if(error.name === "SecurityError"){
      alert("Le navigateur bloque l'accès au microphone dans ce contexte.");
    }else{
      alert("Impossible d'accéder au microphone : " + error.name);
    }
  }
});

fileInput.addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;

  if(!file.type.startsWith("audio/")){
    alert("Veuillez sélectionner un fichier audio.");
    fileInput.value = "";
    return;
  }

  showAudio(file,file.name);
  setStatus("Fichier audio sélectionné.");
});

deleteBtn.addEventListener("click", () => {
  if(currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = null;
  player.pause();
  player.removeAttribute("src");
  player.load();
  player.style.display = "none";
  selected.textContent = "";
  selected.style.display = "none";
  deleteBtn.style.display = "none";
  fileInput.value = "";
  recordBtn.textContent = "🎙️ Enregistrer";
  resetTimer();
  setStatus("Prêt à enregistrer.");
});
</script>
</body>
</html>
